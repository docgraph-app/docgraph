name: Feature request
description: Suggest something DocGraph should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search the [existing issues](https://github.com/docgraph-app/docgraph/issues?q=is%3Aissue) first. If someone
        already asked for it, a 👍 on that issue helps more than a new one.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or situation, not just the solution. Knowing why helps us find the best fit.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it today?
      description: Any workaround you use, or another app that does this well.
